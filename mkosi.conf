[Config]
MinimumVersion=27

[Distribution]
Distribution=fedora
Release=45

[Content]
Hostname=squisher
SELinuxRelabel=true

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=45
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Output]
ImageId=Squisher
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%v_%a
