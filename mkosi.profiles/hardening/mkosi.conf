[Content]
KernelCommandLine=
    # Hardening - memory allocator.
    hardened_usercopy=1
    kfence.sample_interval=100
    slab_nomerge
    init_on_alloc=1
    init_on_free=1
    page_alloc.shuffle=1
    randomize_kstack_offset=on
    pti=on
    hash_pointers=always
    slub_debug=ZF
    cfi=kcfi
    # Hardening - 32-bit ABI.
    ia32_emulation=false
    vdso32=0
    vsyscall=none
    # Hardening - syscalls.
    proc_mem.force_override=ptrace
    # Hardening - IOMMU.
    efi=disable_early_pci_dma
    iommu.passthrough=0
    iommu.strict=1
    iommu=force
    amd_iommu=force_isolation
    intel_iommu=on
    # Hardening - CPU.
    mitigations=auto,nosmt
    mce=0
    spectre_v2=on
    spec_store_bypass_disable=on
    tsx=off
    tsx_async_abort=full,nosmt
    mds=full,nosmt
    l1tf=full,force
    kvm.nx_huge_pages=force
    random.trust_cpu=off
    # Hardening - USB.
    usbcore.nousb
    usbcore.authorized_default=0
    # LSMs.
    lockdown=confidentiality
