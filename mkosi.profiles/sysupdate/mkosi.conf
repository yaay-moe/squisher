[Output]
SplitArtifacts=uki,partitions
Format=disk
ManifestFormat=json

[Content]
Packages=
        systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=unprotected+absent:home=absent:swap=unused+absent:=ignore
        systemd.image_filter=usr=%i_%v:usr-verity=%i_%v_verity:usr-verity-sig=%i_%v_verity_sig:root=%i-*
InitrdProfiles=
KernelInitrdModules=default
RemoveFiles=
        /boot/*-ucode.img
Bootable=true


[Validation]
SecureBoot=no
