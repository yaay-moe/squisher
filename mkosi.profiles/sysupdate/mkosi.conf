[Output]
SplitArtifacts=uki,partitions
Format=disk
ManifestFormat=json

[Content]
Packages=
        systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=uprotected:=ignore
        systemd.image_filter=usr=squisher_*:usr-verity=squisher_*:usr-verity-sig=squisher_*:root=squisher-*
        ipe.enforce=0
        apparmor=1
        lsm=landlock,lockdown,yama,integrity,apparmor,bpf
        console=tty1
        zswap.enabled=0
InitrdProfiles=
KernelInitrdModules=default
RemoveFiles=
        /boot/*-ucode.img
Bootable=true


[Validation]
SecureBoot=no
