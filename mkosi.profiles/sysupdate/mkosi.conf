[Output]
SplitArtifacts=uki,partitions
Format=disk
ManifestFormat=json

[Content]
Packages=
        systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=unprotected+absent:home=absent:swap=unused+absent:=ignore
        systemd.image_filter=usr=Squisher_*:usr-verity=Squisher_*:usr-verity-sig=Squisher_*:root=Squisher-*
        lsm=landlock,lockdown,yama,integrity,apparmor,bpf
InitrdProfiles=
KernelInitrdModules=default
RemoveFiles=
        /boot/*-ucode.img
Bootable=true


[Validation]
SecureBoot=no
