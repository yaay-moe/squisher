---
name: Build Image
on:
  workflow_call:
    inputs:
      publish:
        description: "Publish this image"
        required: false
        type: boolean
        default: false
    secrets:
      SHA256SUM_PGP_KEY:
        description: "The private key used to sign the image hashes"
        required: true

jobs:
  build:
    name: Build sysupdate artifacts with mkosi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          exclude: |
            /opt/hostedtoolcache/Python
          skip-if-available: "64G"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true

      - name: Install just
        shell: bash
        run: |
          sudo apt install -y --no-install-recommends just

      - name: Install mkosi
        uses: systemd/mkosi@2fa9a248a2fecebb0dd64a34c0fecdc5ca8335b9

      - name: Render configuration (for debugging)
        run: mkosi cat-config --debug

      - name: Build the image itself
        id: build
        run: |
          set -e
          # Generate a random key. Echo stderr to /dev/null so that the key is not printed out
          # NOTE: this will break updates for systemd versions below 262.2. Currently using for testing.
          mkosi genkey 2>/dev/null
        
          # Run the build
          just build-sysupdate --profile compress-output

      - name: Sign the build output
        id: sign
        env:
          SIGNING_KEY_ID: "6D247B3E21FA3E17D0DA94827B9A584EE24108F7"
          SIGNING_KEY: ${{ secrets.DEBUGGING_PGP_KEY }}
        run: |
          # Sign the output
          echo -n "${SIGNING_KEY}" | gpg --import
          just sign-build-sysupdate ${SIGNING_KEY_ID}
        
      - uses: actions/upload-artifact@v7
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: Sysupdate artifacts

          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: mkosi.output

